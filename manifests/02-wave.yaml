---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-team-b
  namespace: team-a
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: team-b
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a-app
  namespace: team-a
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: team-a
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: echo
          port: 8000
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /anything/v1
              type: ReplacePrefixMatch
      matches:
        - path:
            type: PathPrefix
            value: /v1
    - backendRefs:
        - group: ""
          kind: Service
          name: echo
          port: 8000
          weight: 1
      filters:
        - requestHeaderModifier:
            add:
              - name: x-route
                value: canary
          type: RequestHeaderModifier
      matches:
        - headers:
            - name: x-canary
              type: Exact
              value: "true"
          path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.kgateway.dev/v1alpha1
